const COLORS = ['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed',
  '#0891b2','#c026d3','#059669','#ea580c','#4f46e5',
  '#0284c7','#65a30d','#b91c1c','#0f766e','#9333ea'];

const state = {userDir: null, folderDir: null, userSelected: {}, folderSelected: {}};

function fmt(gb) {
  if (gb >= 1024) return (gb / 1024).toFixed(1) + ' TB';
  if (gb >= 1)    return gb.toFixed(1) + ' GB';
  if (gb >= 1 / 1024) return (gb * 1024).toFixed(0) + ' MB';
  return (gb * 1024 * 1024).toFixed(0) + ' KB';
}

function niceTicks(maxVal, n) {
  if (maxVal <= 0) return [0];
  const rough = maxVal / n;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = mag * Math.ceil(rough / mag);
  const ticks = [];
  for (let v = 0; v < maxVal + step; v += step) {
    ticks.push(Math.round(v * 1e6) / 1e6);
  }
  return ticks;
}

function barChart(entries) {
  if (!entries.length) return '<p class="no-data">No data.</p>';
  const maxVal = entries[0][1];
  return entries.map(([name, gb]) => {
    const pct = maxVal > 0 ? (gb / maxVal * 100).toFixed(2) : 0;
    return `<div class="bar-row">
  <div class="bar-label" title="${name}">${name}</div>
  <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
  <div class="bar-size">${fmt(gb)}</div>
</div>`;
  }).join('');
}

// "2026-11-07" -> "11/07/26"
function shortDate(d) {
  const [y, m, day] = d.split('-');
  return `${m}/${day}/${y.slice(2)}`;
}

function totalLineChart(snaps) {
  if (!snaps || !snaps.length) return '<p class="no-data">No historical data.</p>';
  const dates = snaps.map(s => s.date);
  const values = snaps.map(s => s.total || 0);
  const maxVal = Math.max(...values);
  if (maxVal === 0) return '<p class="no-data">No data.</p>';

  const useTB = maxVal > 512;
  const sc = useTB ? 1 / 1024 : 1;
  const ticks = niceTicks(maxVal * sc, 5);
  const tickMax = ticks[ticks.length - 1];
  const effectiveMax = tickMax / sc;

  const W = 540, H = 320;
  const pad = {t: 20, r: 10, b: 58, l: 64};
  const cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;
  const n = dates.length;
  const xp = i => pad.l + (n > 1 ? i / (n - 1) * cW : cW / 2);
  const yp = v => pad.t + cH * (1 - v / effectiveMax);

  const s = [];
  ticks.forEach(tick => {
    const y = yp(tick / sc);
    s.push(`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${(pad.l + cW).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e5e7eb" stroke-width="1"/>`);
    s.push(`<text x="${(pad.l - 5).toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#6b7280">${tick}${useTB ? 'T' : 'G'}</text>`);
  });
  dates.forEach((d, i) => {
    const x = xp(i);
    s.push(`<line x1="${x.toFixed(1)}" y1="${(pad.t + cH)}" x2="${x.toFixed(1)}" y2="${(pad.t + cH + 5)}" stroke="#9ca3af" stroke-width="1"/>`);
    const ly = pad.t + cH + 12;
    s.push(`<text x="${x.toFixed(1)}" y="${ly}" text-anchor="end" font-size="10" fill="#6b7280" transform="rotate(-45 ${x.toFixed(1)} ${ly})"><title>${d}</title>${shortDate(d)}</text>`);
  });
  s.push(`<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${(pad.t + cH)}" stroke="#9ca3af" stroke-width="1"/>`);
  s.push(`<line x1="${pad.l}" y1="${(pad.t + cH)}" x2="${(pad.l + cW)}" y2="${(pad.t + cH)}" stroke="#9ca3af" stroke-width="1"/>`);

  const pts = values.map((v, i) => ({x: xp(i), y: yp(v)}));
  if (n > 1) {
    const d = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    s.push(`<path d="${d}" fill="none" stroke="#2563eb" stroke-width="2.5"/>`);
  }
  pts.forEach((p, pi) => {
    s.push(`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="5" fill="#2563eb" stroke="#fff" stroke-width="1.5"><title>${dates[pi]}: ${fmt(values[pi])}</title></circle>`);
  });

  const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="-apple-system,sans-serif" style="max-width:100%">${s.join('')}</svg>`;
  const legend = `<div class="legend-item"><div class="legend-dot" style="background:#2563eb"></div><span class="legend-name">Total</span></div>`;
  return `<div class="chart-wrap"><div>${svg}</div><div>${legend}</div></div>`;
}

function lineChart(snapshots, entityKey, entities) {
  if (!snapshots || !snapshots.length) return '<p class="no-data">No historical data.</p>';
  const latest = snapshots[snapshots.length - 1][entityKey];
  const topEntities = Array.isArray(entities)
    ? entities
    : Object.entries(latest).sort((a, b) => b[1] - a[1]).slice(0, entities).map(([k]) => k);
  if (!topEntities.length) return '<p class="no-data">No entities selected.</p>';
  const dates = snapshots.map(s => s.date);
  let maxVal = 0;
  topEntities.forEach(e => snapshots.forEach(s => {
    const v = s[entityKey][e] || 0;
    if (v > maxVal) maxVal = v;
  }));
  if (maxVal === 0) return '<p class="no-data">No data.</p>';

  const useTB = maxVal > 512;
  const sc = useTB ? 1 / 1024 : 1;
  const ticks = niceTicks(maxVal * sc, 5);
  const tickMax = ticks[ticks.length - 1];
  const effectiveMax = tickMax / sc;

  const W = 540, H = 320;
  const pad = {t: 20, r: 10, b: 58, l: 64};
  const cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;
  const n = dates.length;
  const xp = i => pad.l + (n > 1 ? i / (n - 1) * cW : cW / 2);
  const yp = v => pad.t + cH * (1 - v / effectiveMax);

  const s = [];

  ticks.forEach(tick => {
    const y = yp(tick / sc);
    s.push(`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${(pad.l + cW).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e5e7eb" stroke-width="1"/>`);
    s.push(`<text x="${(pad.l - 5).toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#6b7280">${tick}${useTB ? 'T' : 'G'}</text>`);
  });

  dates.forEach((d, i) => {
    const x = xp(i);
    s.push(`<line x1="${x.toFixed(1)}" y1="${(pad.t + cH)}" x2="${x.toFixed(1)}" y2="${(pad.t + cH + 5)}" stroke="#9ca3af" stroke-width="1"/>`);
    const ly = pad.t + cH + 12;
    s.push(`<text x="${x.toFixed(1)}" y="${ly}" text-anchor="end" font-size="10" fill="#6b7280" transform="rotate(-45 ${x.toFixed(1)} ${ly})"><title>${d}</title>${shortDate(d)}</text>`);
  });

  s.push(`<line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${(pad.t + cH)}" stroke="#9ca3af" stroke-width="1"/>`);
  s.push(`<line x1="${pad.l}" y1="${(pad.t + cH)}" x2="${(pad.l + cW)}" y2="${(pad.t + cH)}" stroke="#9ca3af" stroke-width="1"/>`);

  topEntities.forEach((entity, ei) => {
    const color = COLORS[ei % COLORS.length];
    const pts = snapshots.map((snap, i) => ({x: xp(i), y: yp(snap[entityKey][entity] || 0)}));
    if (n > 1) {
      const d = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
      s.push(`<path d="${d}" fill="none" stroke="${color}" stroke-width="2" opacity="0.85"/>`);
    }
    pts.forEach((p, pi) => {
      const val = snapshots[pi][entityKey][entity] || 0;
      s.push(`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${color}" stroke="#fff" stroke-width="1.5"><title>${entity}: ${fmt(val)} (${dates[pi]})</title></circle>`);
    });
  });

  const svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="-apple-system,sans-serif" style="max-width:100%">${s.join('')}</svg>`;
  const legend = topEntities.map((e, i) => {
    const v = latest[e] || 0;
    const short = e.length > 16 ? e.slice(0, 15) + '…' : e;
    return `<div class="legend-item"><div class="legend-dot" style="background:${COLORS[i % COLORS.length]}"></div><span class="legend-name" title="${e}">${short}</span><span class="legend-val">${fmt(v)}</span></div>`;
  }).join('');

  return `<div class="chart-wrap"><div>${svg}</div><div>${legend}</div></div>`;
}

function initSelection(type, dir, snaps, entityKey, defaultN) {
  const key = type + 'Selected';
  if (!state[key][dir]) {
    const latest = snaps[snaps.length - 1][entityKey];
    const top = Object.entries(latest).sort((a, b) => b[1] - a[1]).slice(0, defaultN).map(([k]) => k);
    state[key][dir] = new Set(top);
  }
}

function buildEntitySelector(type, dir, allEntries, sel) {
  const rows = allEntries.map(([name, gb]) => {
    const checked = sel.has(name) ? 'checked' : '';
    return `<label class="entity-row" data-name="${name.toLowerCase()}" data-entity="${name}">` +
      `<input type="checkbox" ${checked} onchange="toggleEntity('${type}','${dir}',this.closest('.entity-row').dataset.entity)">` +
      `<span class="entity-name" title="${name}">${name}</span>` +
      `<span class="entity-val">${fmt(gb)}</span>` +
      `</label>`;
  }).join('');
  return `<div class="entity-selector">` +
    `<input type="text" class="entity-search" placeholder="Search..." oninput="filterEntityList(this,'${type}-entity-list')">` +
    `<div class="entity-list" id="${type}-entity-list">${rows}</div>` +
    `</div>`;
}

function toggleEntity(type, dir, name) {
  const key = type + 'Selected';
  const sel = state[key][dir];
  if (sel.has(name)) sel.delete(name); else sel.add(name);
  const snaps = type === 'user' ? (DATA.byUser[dir] || []) : (DATA.byFolder[dir] || []);
  const entityKey = type === 'user' ? 'users' : 'folders';
  document.getElementById(type + '-right-chart').innerHTML = lineChart(snaps, entityKey, Array.from(sel));
}

function filterEntityList(input, listId) {
  const q = input.value.toLowerCase();
  document.getElementById(listId).querySelectorAll('.entity-row').forEach(row => {
    row.style.display = row.dataset.name.includes(q) ? '' : 'none';
  });
}

function renderDirBtns(containerEl, dirs, activeDir, setter) {
  containerEl.innerHTML = dirs.map(d =>
    `<button class="dir-btn${d === activeDir ? ' active' : ''}" onclick="${setter}('${d}')">${d}</button>`
  ).join('');
}

function renderUserView(dir) {
  const snaps = DATA.byUser[dir] || [];
  const el = document.getElementById('user-view');
  if (!snaps.length) { el.innerHTML = '<p class="no-data">No data for this directory.</p>'; return; }
  const latest = snaps[snaps.length - 1];
  const entries = Object.entries(latest.users).sort((a, b) => b[1] - a[1]);
  const banner = `<div class="total-banner"><span class="total-value">${fmt(latest.total)}</span><span class="total-label">total used in /${dir} as of ${latest.date}</span></div>`;
  const warn = `<div class="warning">⚠ Totals here are computed by summing individual file sizes via <code>stat</code>, not <code>du</code>. They will be lower than the By Folder tab, which uses <code>du</code> and accounts for filesystem block overhead. The By Folder tab is more accurate.</div>`;
  initSelection('user', dir, snaps, 'users', 10);
  const allUsers = Object.entries(latest.users).sort((a, b) => b[1] - a[1]);
  const userSel = buildEntitySelector('user', dir, allUsers, state.userSelected[dir]);
  el.innerHTML =
    banner + warn +
    `<div class="card card-scroll"><p class="card-title">Latest Snapshot — ${latest.date}</p>${barChart(entries)}</div>` +
    `<div class="card"><p class="card-title">History</p><div class="chart-pair">` +
      `<div class="chart-panel"><p class="chart-panel-title">Total size over time</p>${totalLineChart(snaps)}</div>` +
      `<div class="chart-panel" style="flex:2"><p class="chart-panel-title">Users</p><div class="selector-chart-wrap"><div id="user-right-chart"></div><div class="selector-sidebar">${userSel}</div></div></div>` +
    `</div></div>`;
  document.getElementById('user-right-chart').innerHTML = lineChart(snaps, 'users', Array.from(state.userSelected[dir]));
}

function renderFolderView(dir) {
  const snaps = DATA.byFolder[dir] || [];
  const el = document.getElementById('folder-view');
  if (!snaps.length) { el.innerHTML = '<p class="no-data">No data for this directory.</p>'; return; }
  const latest = snaps[snaps.length - 1];
  const entries = Object.entries(latest.folders).sort((a, b) => b[1] - a[1]);
  const banner = `<div class="total-banner"><span class="total-value">${fmt(latest.total)}</span><span class="total-label">total used in /${dir} as of ${latest.date}</span></div>`;
  initSelection('folder', dir, snaps, 'folders', 15);
  const allFolders = Object.entries(latest.folders).sort((a, b) => b[1] - a[1]);
  const folderSel = buildEntitySelector('folder', dir, allFolders, state.folderSelected[dir]);
  el.innerHTML =
    banner +
    `<div class="card card-scroll"><p class="card-title">Latest Snapshot — ${latest.date}</p>${barChart(entries)}</div>` +
    `<div class="card"><p class="card-title">History</p><div class="chart-pair">` +
      `<div class="chart-panel"><p class="chart-panel-title">Total size over time</p>${totalLineChart(snaps)}</div>` +
      `<div class="chart-panel" style="flex:2"><p class="chart-panel-title">Folders</p><div class="selector-chart-wrap"><div id="folder-right-chart"></div><div class="selector-sidebar">${folderSel}</div></div></div>` +
    `</div></div>`;
  document.getElementById('folder-right-chart').innerHTML = lineChart(snaps, 'folders', Array.from(state.folderSelected[dir]));
}

function setUserDir(dir) {
  state.userDir = dir;
  renderDirBtns(document.getElementById('user-dirs'), Object.keys(DATA.byUser), dir, 'setUserDir');
  renderUserView(dir);
}

function setFolderDir(dir) {
  state.folderDir = dir;
  renderDirBtns(document.getElementById('folder-dirs'), Object.keys(DATA.byFolder), dir, 'setFolderDir');
  renderFolderView(dir);
}

function switchTab(name, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

(function init() {
  const ud = Object.keys(DATA.byUser);
  const fd = Object.keys(DATA.byFolder);
  if (ud.length) setUserDir(ud[0]);
  if (fd.length) setFolderDir(fd[0]);
})();
</script>
